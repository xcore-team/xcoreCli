[project]
name = "xcorecli"
version = "0.1.0"
description = "CLI for xcore — configuration, plugins, deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.3.4",
    "typer>=0.25.1",
    "xcore",
    "pyyaml>=6.0.1",
    "psutil>=5.9",
]

[project.scripts]
xcli = "xcli.main:app"

[tool.uv]
package = true

[tool.uv.sources]
xcore = { git = "https://www.github.com/traoreera/xcore.git" }
