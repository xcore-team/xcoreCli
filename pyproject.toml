[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xcorecli"
version = "1.1.0"
description = "CLI for xcore — configuration, plugins, deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "rich>=14.3.4",
    "sqlalchemy>=2.0.0",
    "typer>=0.25.1",
    "pyyaml>=6.0.1",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.scripts]
xcore-cli = "xcli.main:app"
xcli = "xcli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["xcli"]

[tool.uv]
package = true


[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
]
