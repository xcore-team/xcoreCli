app:
  name: xcore-app
  env: development
  debug: true
  secret_key: change-me-in-production
  plugin_prefix: /app
  plugin_tags: []
  server_key: change-me-in-production
  server_key_iterations: 100000
  fastapi:
    title: xcore-app
    version: 0.1.0
    docs_url: /docs
    redoc_url: /redoc
    openapi_url: /openapi.json
    redirect_slashes: true
  server:
    host: 0.0.0.0
    port: 8000
    workers: 1
    reload: true
    log_level: DEBUG
    proxy_headers: true
    forwarded_allow_ips: '*'
plugins:
  directory: ./app
  secret_key: change-me-in-production
  strict_trusted: false
  interval: 10
  entry_point: src/main.py
services:
  databases:
    default:
      type: sqlasync
      url: sqlite+aiosqlite:///./xcore.db
      echo: false
  cache:
    backend: memory
    ttl: 300
    max_size: 1000
  scheduler:
    enabled: false
    backend: memory
    timezone: UTC
observability:
  logging:
    level: DEBUG
    format: '%(asctime)s [%(levelname)s] [%(name)s] %(message)s'
    file: log/app.log
    max_bytes: 10485760
    backup_count: 5
  metrics:
    enabled: false
    backend: memory
    prefix: xcore-app
  tracing:
    enabled: false
    backend: noop
    service_name: xcore-app
    endpoint: null
security:
  allowed_imports:
  - fastapi
  - json
  - re
  - math
  - datetime
  - typing
  - dataclasses
  - enum
  - functools
  - collections
  - hashlib
  - base64
  - asyncio
  - logging
  - uuid
  forbidden_imports: []
  rate_limit_default:
    calls: 100
    period_seconds: 60
marketplace:
  url: https://localhost:8000
  api_key: '1234'
  timeout: 10
  cache_ttl: 300
