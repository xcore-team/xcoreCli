name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # 👈 ajoute un bouton "Run workflow" dans GitHub Actions
    inputs:
      tag:
        description: "Tag à republier (ex: v1.2.3)"
        required: true
        type: string
      force:
        description: "Confirmer la republication de la même version"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le consentement
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.force }}" != "true" ]; then
            echo "❌ Cochez 'force' pour confirmer la republication."
            exit 1
          fi
          echo "✅ Republication confirmée pour ${{ inputs.tag }}"

  #test:
  #  name: Run tests
  #  runs-on: ubuntu-latest
  #  needs: validate
  #  steps:
  #    - name: Checkout (tag manuel ou push)
  #      uses: actions/checkout@v4
  #      with:
  #        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  #
  #    - name: Install uv
  #      uses: astral-sh/setup-uv@v4
  #      with:
  #        version: "latest"
  #        enable-cache: true
  #
  #    - name: Set up Python
  #      run: uv python install 3.12
  #
  #    - name: Install dependencies
  #      run: uv sync --all-extras
  #
  #    - name: Run tests
  #      run: uv run pytest

  build-and-publish:
    name: Build and publish xcore-cli
    runs-on: ubuntu-latest
    # needs: test
    environment: pypi

    steps:
      - name: Checkout (tag manuel ou push)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
