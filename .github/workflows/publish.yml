name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # requis pour Trusted Publishing OIDC

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

  build-and-publish:
    name: Build and publish xcore-cli
    runs-on: ubuntu-latest
    needs: test  # bloque la pub si les tests échouent
    environment: pypi  # environnement protégé dans GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
        # Pas besoin de token grâce à OIDC — configurer sur pypi.org
